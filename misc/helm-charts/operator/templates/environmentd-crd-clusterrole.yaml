# This ClusterRole provides minimal permissions for environmentd when using
# the CRD-based orchestrator. Instead of managing StatefulSets/Services directly,
# environmentd only creates MaterializeClusterReplica CRDs, and orchestratord
# handles the underlying Kubernetes resources.
#
# This significantly reduces the blast radius of environmentd's permissions.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "materialize-operator.fullname" . }}-environmentd-crd
  labels:
    {{- include "materialize-operator.labels" . | nindent 4 }}
rules:
# Allow managing cluster replica CRDs
- apiGroups: ["materialize.cloud"]
  resources:
  - materializeclusters
  - materializeclusters/status
  - materializeclusterreplicas
  - materializeclusterreplicas/status
  verbs:
  - create
  - update
  - patch
  - delete
  - get
  - list
  - watch

# Read-only access to pods for metrics collection
- apiGroups: [""]
  resources:
  - pods
  verbs:
  - get
  - list

# Metrics access
- apiGroups: ["metrics.k8s.io"]
  resources:
  - pods
  verbs:
  - get
  - list

{{- end }}
