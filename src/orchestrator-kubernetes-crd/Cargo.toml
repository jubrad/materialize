[package]
name = "mz-orchestrator-kubernetes-crd"
description = "Service orchestration via Kubernetes CRDs (managed by orchestratord)."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.101"
async-trait = "0.1.89"
chrono = { version = "0.4.39", default-features = false, features = ["std"] }
futures = "0.3.31"
k8s-openapi = { version = "0.27.0", features = ["v1_32"] }
kube = { version = "3.0.1", default-features = false, features = ["client", "runtime", "ws"] }
mz-cloud-resources = { path = "../cloud-resources", default-features = false }
mz-orchestrator = { path = "../orchestrator", default-features = false }
mz-ore = { path = "../ore", default-features = false, features = ["async"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.149"
tokio = "1.49.0"
tracing = "0.1.44"
workspace-hack = { version = "0.0.0", path = "../workspace-hack", optional = true }

[features]
default = ["workspace-hack"]

[package.metadata.cargo-udeps.ignore]
normal = ["workspace-hack"]
